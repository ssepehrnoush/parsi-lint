name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/rules.test.mjs
      - name: CLI smoke test
        run: |
          node bin/parsi-lint.mjs --version
          node bin/parsi-lint.mjs --list-rules
